<style>
  .legal-section { margin-top: 2rem; }
  .legal-section h2 { font-size: 1rem; font-weight: 600; margin-bottom: .5rem; }
  .legal-excerpt { margin: 0; padding: .75rem 1rem; border: 1px solid rgb(0 0 0 / .1); border-radius: .5rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .legal-excerpt.is-truncated { -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent); mask-image: linear-gradient(to bottom, #000 60%, transparent); }
  .legal-toggle { margin-top: .5rem; padding: .375rem .75rem; border: 1px solid rgb(0 0 0 / .15); border-radius: .375rem; font-weight: 500; cursor: pointer; }
  .legal-toggle:hover { border-color: var(--color-primary-500, #3b82f6); }
  .legal-full { margin-top: .75rem; }
  .legal-full .legal-source { flex: 1 1 50%; min-width: 0; box-sizing: border-box; height: clamp(360px, 70vh, 900px); overflow: auto; margin: 0; padding: 1rem 1.25rem; border: 1px solid var(--md-border); border-radius: .375rem; background: var(--md-surface); color: var(--md-text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .legal-editor .blog-md-preview, .legal-editor > .blog-md-wrapper > textarea.blog-markdown-editor, .legal-monaco { height: clamp(360px, 70vh, 900px); }
  .legal-editor .blog-md-preview { min-width: 0; }
  .legal-monaco { flex: 1 1 50%; min-width: 0; box-sizing: border-box; overflow: hidden; border: 1px solid var(--md-border); border-radius: .375rem; }
  .legal-md-block { display: contents; }
  .legal-md-block:first-child > :first-child { margin-top: 0 !important; }
  @media (max-width: 1024px) { .legal-monaco { flex: 0 0 auto; width: 100%; height: clamp(240px, 40vh, 480px); } }
  .dark .legal-excerpt { border-color: rgb(255 255 255 / .12); }
  .dark .legal-toggle { border-color: rgb(255 255 255 / .2); }
  .ld-toolbar { display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline; margin-bottom: .75rem; }
  .ld-toolbar a { text-decoration: underline; text-underline-offset: 2px; }
  .ld-toolbar a[aria-current="true"] { font-weight: 600; text-decoration: none; }
  .ld-stat-add { color: #15803d; font-weight: 600; }
  .ld-stat-del { color: #b91c1c; font-weight: 600; }
  .ld-hint { opacity: .7; }
  .ld-status { margin-top: .5rem; }
  .legal-diff { border: 1px solid rgb(0 0 0 / .1); border-radius: .5rem; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.6; }
  .ld-row { display: grid; grid-template-columns: 3rem 3rem 1.5rem 1fr; }
  .ld-num { padding: 0 .5rem; text-align: right; opacity: .5; user-select: none; }
  .ld-sign { text-align: center; user-select: none; }
  .ld-text { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: .75rem; }
  .ld-add { background: #ecfdf3; }
  .ld-del { background: #fef2f2; }
  .ld-add ins { background: #bbf7d0; text-decoration: none; border-radius: 2px; }
  .ld-del del { background: #fecaca; border-radius: 2px; }
  .ld-gap { padding: .25rem 1rem; background: rgb(0 0 0 / .04); opacity: .7; font-family: inherit; }
  .dark .legal-diff { border-color: rgb(255 255 255 / .12); }
  .dark .ld-add { background: rgb(22 101 52 / .25); }
  .dark .ld-del { background: rgb(153 27 27 / .25); }
  .dark .ld-add ins { background: rgb(34 197 94 / .35); }
  .dark .ld-del del { background: rgb(239 68 68 / .35); }
  .dark .ld-gap { background: rgb(255 255 255 / .05); }
  .dark .ld-stat-add { color: #4ade80; }
  .dark .ld-stat-del { color: #f87171; }
</style>
{% if original.is_published %}
<section class="legal-section" data-legal-content>
  <h2>Content</h2>
  <pre class="legal-excerpt{% if legal_is_truncated %} is-truncated{% endif %}" data-legal-excerpt>{{ legal_excerpt }}</pre>
  <button type="button" class="legal-toggle" data-legal-toggle aria-expanded="false">Show full content</button>
  <div class="blog-md-editor legal-editor legal-full" data-legal-full hidden>
    <div class="blog-md-wrapper">
      <pre class="legal-source" data-legal-source>{{ original.content }}</pre>
      <div class="blog-md-preview" data-legal-preview></div>
    </div>
  </div>
</section>
{% endif %}
{% if legal_diff_url or legal_diff or legal_diff_none %}
<section class="legal-section">
  <h2>Changes</h2>
  <div data-legal-diff{% if legal_diff_url %} data-url="{{ legal_diff_url }}"{% endif %}>
    {% include "admin/legal/document_diff.html" %}
  </div>
  <p class="ld-hint ld-status" data-legal-diff-status role="status" hidden></p>
</section>
{% endif %}
